<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Métricas — Perfiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <h1>Dashboard de Métricas</h1>
    </header>

    <!-- Upload -->
    <section class="upload-section">
      <label for="excel-input" class="file-label">
        <div class="upload-icon">📂</div>
        <span>Selecciona tu archivo Excel</span>
        <em>.xlsx · .xls</em>
        <input type="file" id="excel-input" accept=".xlsx,.xls" hidden>
      </label>
      <p class="file-info" id="file-info"></p>
    </section>

    <!-- Controles -->
    <section class="controls-section" id="controls-section" style="display: none;">
      <div class="controls-top">
        <div class="filter-container">
          <label for="date-start">Filtrar por fecha</label>
          <div class="date-range">
            <input type="month" id="date-start" class="date-input">
            <span>→</span>
            <input type="month" id="date-end" class="date-input">
          </div>
        </div>
        <div class="controls-actions">
          <button
            id="download-pdf"
            class="btn-icon"
            type="button"
            aria-label="Descargar informe en PDF"
            data-tooltip="Descargar informe en PDF"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/>
            </svg>
          </button>
          <button id="reset-filter" class="btn-secondary">Limpiar filtro</button>
        </div>
      </div>
    </section>

    <!-- Resultados -->
    <section class="results-section" id="results-section" style="display: none;">
      <div id="stats-grid"></div>
    </section>

    <!-- Error -->
    <div id="error-message" class="error-message" style="display: none;"></div>

  </div>

  <!-- Librerías -->
  <script src="lib/xlsx.full.min.js"></script>
  <script src="lib/chart.umd.js"></script>

  <!-- Módulos -->
  <script src="js/loader.js"></script>
  <script src="js/dataTransform.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
