cd /workspaces/dashboard-excel
python3 -m http.server 8000http://localhost:8080<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Métricas - Perfiles</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>Dashboard de Métricas</h1>
      <p class="subtitle">Consulta de resultados por mes</p>
    </header>

    <!-- Sección de carga de archivo -->
    <section class="upload-section">
      <label for="excel-input" class="file-label">
        <span>Selecciona tu archivo Excel</span>
        <input type="file" id="excel-input" accept=".xlsx, .xls" hidden>
      </label>
      <p class="file-info" id="file-info"></p>
    </section>

    <!-- Controles de filtrado -->
    <section class="controls-section" id="controls-section" style="display: none;">
      <div class="filter-container">
        <label for="date-start">Filtrar por fecha:</label>
        <div class="date-range">
          <input type="date" id="date-start" class="date-input">
          <span>a</span>
          <input type="date" id="date-end" class="date-input">
        </div>
      </div>
      <button id="reset-filter" class="btn-secondary">Limpiar filtro</button>
    </section>

    <!-- Área de resultados -->
    <section class="results-section" id="results-section" style="display: none;">
      <!-- Estadísticas -->
      <div class="stats-grid" id="stats-grid">
        <!-- Aquí se inyectarán dinámicamente las tarjetas de estadísticas -->
      </div>
    </section>

    <!-- Mensaje de error -->
    <div id="error-message" class="error-message" style="display: none;"></div>
  </div>

  <!-- Librerías externas -->
  <script src="lib/xlsx.full.min.js"></script>
  <script src="lib/chart.umd.js"></script>

  <!-- Nuestros módulos -->
  <script src="js/loader.js"></script>
  <script src="js/dataTransform.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
